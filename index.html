<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--PAGE-START-->
<title>Birth Arcana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mystery+Quest&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">

<div class="app" id="app">

  <!-- 01 메인 -->
  <section class="screen home" id="home" aria-labelledby="home-title">
    <h1 class="wordmark" id="home-title">Birth Arcana</h1>
    <img class="hero" src="images/hero.webp" alt="초승달 아래 두 탑 사이로 강이 흐르는 The Moon 카드" width="600" height="1028">
    <button type="button" class="btn primary" id="start">내 카드 찾기</button>
  </section>

  <!-- 02 생일 입력 -->
  <section class="screen input" id="input" hidden aria-labelledby="input-title">
    <header class="bar">
      <button type="button" class="icon-btn" id="input-back" aria-label="처음으로">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12H5M10 6L4 12L10 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="bar-title">Birth Arcana</span>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>

    <form class="birth-form" id="birth-form" novalidate>
      <svg class="spark" viewBox="0 0 48 48" width="52" height="52" aria-hidden="true"><path d="M24 4Q27 21 44 24Q27 27 24 44Q21 27 4 24Q21 21 24 4Z" fill="#9b86c4"/></svg>
      <h2 class="prompt" id="input-title">태어난 날을 입력하세요</h2>
      <div class="fields">
        <label class="field">
          <span class="field-label">month</span>
          <input id="month" name="month" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="03" autocomplete="bday-month" aria-label="태어난 달">
        </label>
        <label class="field">
          <span class="field-label">date</span>
          <input id="day" name="day" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="07" autocomplete="bday-day" aria-label="태어난 날">
        </label>
      </div>
      <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>
      <button type="submit" class="btn primary" id="find">내 카드 찾기</button>
      <div class="examples">
        <span class="examples-label">예시</span>
        <button type="button" class="chip" data-m="11" data-d="5">11월 5일</button>
        <button type="button" class="chip" data-m="2" data-d="8">2월 8일</button>
        <button type="button" class="chip" data-m="3" data-d="7">3월 7일</button>
      </div>
    </form>
  </section>

  <!-- 03·04 카드 -->
  <section class="screen stage" id="stage" hidden aria-label="나의 카드">
    <header class="bar">
      <button type="button" class="icon-btn" id="back" aria-label="다른 생일 입력">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12H5M10 6L4 12L10 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="bar-title">Birth Arcana</span>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>

    <div class="card-area" id="card-area">
      <div class="halo" aria-hidden="true"></div>
      <div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
        <div class="card-bob" id="card-bob">
          <div class="card-inner" id="card-inner">
            <div class="face front" id="face-front"></div>
            <div class="face back" id="face-back"></div>
          </div>
        </div>
      </div>
      <div class="burst" id="burst" aria-hidden="true"></div>
    </div>

    <p class="hint" id="hint">카드를 눌러 보세요</p>
    <div class="actions" id="actions" hidden>
      <button type="button" class="btn primary" id="save">이미지 저장하기</button>
    </div>
    <p class="sr-only" id="announce" aria-live="polite"></p>

    <section class="explain" id="explain" hidden aria-labelledby="explain-title">
      <h2 id="explain-title">이 카드가 나온 이유</h2>
      <ol class="chain" id="why-chain"></ol>
      <p class="range" id="why-range"></p>
      <ul class="notes" id="why-notes"></ul>
    </section>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="data/zodiac-ranges.js"></script>
<script src="data/card-map.js"></script>
<script src="data/card-content.js"></script>
<script src="js/lookup.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
<!--PAGE-END-->
</body>
</html>
